
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          mkdir android-project
          unzip -q berserker-arena-android.zip -d android-project

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: berserker-arena-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
