<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>Berserker Arena</title>

<style>
/* Layout: tela de arcade 16:10 no topo, controles de polegar embaixo; a loja é um painel que cobre tudo.
   Visual único e escuro de propósito: é uma tela de fliperama. */
:root{
  --bg:#0d0a12; --panel:#1b1421; --edge:#3b2c47; --ink:#f3e9dc; --muted:#a393ac;
  --blood:#e2392b; --ember:#ff9a2e; --steel:#6fb7d6; --gold:#ffd23f; --arc:#b88cff;
  --display:'Bungee','Impact',sans-serif; --ui:'Chakra Petch',system-ui,sans-serif;
  --b:clamp(54px,15.5vw,84px);
  color-scheme:dark;
}
html,body{box-sizing:border-box;background:var(--bg);height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{
  color:var(--ink); font-family:var(--ui);
  padding-block:8px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
.wrap{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;position:relative}
#game{width:100%;aspect-ratio:16/10;display:block;background:#000;border:2px solid var(--edge);border-radius:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.dpad{display:flex;width:calc(var(--b)*2 + 10px);height:calc(var(--b) + 8px);border:2px solid var(--edge);border-radius:999px;background:linear-gradient(#2a1f33,#1a1320);touch-action:none;overflow:hidden;flex:none}
.half{flex:1;display:grid;place-items:center;color:var(--muted);transition:background .06s,color .06s}
.half.on{background:#4a2a2a;color:var(--ink)}
.half svg{width:30px;height:30px}
.act{display:grid;grid-template-columns:repeat(3,var(--b));gap:8px}
.btn{
  width:var(--b);height:var(--b);border-radius:50%;
  border:2px solid var(--edge);background:linear-gradient(#2a1f33,#1a1320);
  color:var(--ink);font:700 clamp(10px,3vw,13px)/1 var(--ui);letter-spacing:.03em;
  touch-action:none;user-select:none;-webkit-user-select:none;padding:0;cursor:pointer;
}
.btn[data-k=punch]{border-color:var(--ember)}
.btn[data-k=kick]{border-color:var(--steel)}
.btn[data-k=rage]{border-color:var(--blood)}
.btn[data-k=dash]{border-color:#7ee0a8}
.btn[data-k=power]{border-color:var(--arc)}
.btn.on{transform:translateY(2px) scale(.96);background:#4a2a2a}
.btn.cool{opacity:.5;font-size:clamp(14px,4vw,18px)}
.btn.dim{opacity:.55}
.btn.ready{animation:pulse .7s ease-in-out infinite alternate;background:#5a1d18;color:#fff}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(226,57,43,.0)}to{box-shadow:0 0 18px 4px rgba(226,57,43,.7)}}
.btn:focus-visible,.snd:focus-visible,.buy:focus-visible,.tabs button:focus-visible,.go:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.foot{flex:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hint{margin:0;font-size:13px;line-height:1.5;color:var(--muted);min-width:0;flex:1}
.hint b{color:var(--ink);font-weight:700}
.foot-btns{display:flex;gap:8px;flex:none}
.snd{flex:none;border:2px solid var(--edge);background:var(--panel);color:var(--ink);font:700 13px var(--ui);padding:8px 12px;border-radius:999px;cursor:pointer}
.snd.gold{border-color:var(--gold);color:var(--gold)}

.shop{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:10px;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.shop[hidden]{display:none}
.shop-top{grid-area:top;display:flex;justify-content:space-between;align-items:center}
.shop-top b{font:400 22px var(--display);color:var(--ember);letter-spacing:.02em}
.coins{font:700 17px var(--ui);color:var(--gold);border:2px solid var(--edge);border-radius:999px;padding:4px 12px;background:var(--panel)}
#pv{grid-area:pv;width:100%;height:clamp(150px,28vh,230px);flex:none;border:2px solid var(--edge);border-radius:8px;background:radial-gradient(ellipse at 50% 85%,#3a2450,#120b1a 70%)}
.tabs{grid-area:tabs;display:flex;gap:8px;flex:none}
.tabs button{flex:1;padding:10px 4px;border:2px solid var(--edge);background:var(--panel);color:var(--ink);font:700 14px var(--ui);border-radius:10px;cursor:pointer}
.tabs button.on{background:#4a2a2a;border-color:var(--blood)}
.items{grid-area:list;list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.item{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 12px;border:2px solid var(--edge);border-radius:10px;background:var(--panel);flex:none}
.item.sel{border-color:var(--ember)}
.meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.meta b{font-size:15px}
.meta span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.meta i{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--arc)}
.buy{flex:none;min-width:108px;padding:10px 8px;border:2px solid var(--gold);background:#2b2208;color:var(--gold);font:700 13px var(--ui);border-radius:10px;cursor:pointer}
.buy.own{border-color:var(--steel);background:#10222c;color:var(--steel)}
.buy.on{border-color:var(--edge);background:transparent;color:var(--muted)}
.buy:disabled{opacity:.5;cursor:default}
.grp{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:2px solid var(--edge);border-radius:10px;background:var(--panel)}
.grp>b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--arc)}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--edge);padding:0;cursor:pointer;flex:none}
.sw.on{border-color:var(--ember);box-shadow:0 0 0 2px #000 inset}
.pill{padding:8px 12px;border:2px solid var(--edge);background:transparent;color:var(--ink);font:700 13px var(--ui);border-radius:999px;cursor:pointer}
.pill.on{border-color:var(--ember);background:#3a2418}
.sw:focus-visible,.pill:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.go{grid-area:go;flex:none;padding:14px;border:0;background:var(--blood);color:#fff;font:400 17px var(--display);border-radius:10px;cursor:pointer;letter-spacing:.02em}

@media (pointer:coarse){.hint{display:none}.foot{justify-content:flex-end}}
/* Celular deitado: a tela ocupa a altura toda e os controles flutuam nas laterais */
@media (orientation:landscape) and (max-height:520px){
  body{padding-block:0}
  .wrap{max-width:none;gap:0;--b:clamp(50px,15vh,72px)}
  #game{height:100%;width:auto;max-width:100%;margin:0 auto;border-radius:0;border-width:0}
  .pad{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom,0px));flex:none;pointer-events:none;align-items:flex-end}
  .pad>*{pointer-events:auto;opacity:.82}
  .foot{position:absolute;top:8px;right:max(10px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  .shop{display:grid;grid-template-columns:minmax(150px,36%) 1fr;grid-template-rows:auto auto 1fr auto;grid-template-areas:"top top" "pv tabs" "pv list" "go go";gap:8px 14px}
  #pv{height:100%}
}
@media (prefers-reduced-motion:reduce){.btn.ready{animation:none;box-shadow:0 0 14px 3px rgba(226,57,43,.7)}}
</style>

<main class="wrap">
  <canvas id="game" aria-label="Arena de luta: Berserker contra os lutadores"></canvas>

  <div class="pad">
    <div id="dpad" class="dpad" aria-label="Mover">
      <div id="dl" class="half"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4 5 12l12 8z" fill="currentColor"/></svg></div>
      <div id="dr" class="half"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 12 8-12 8z" fill="currentColor"/></svg></div>
    </div>
    <div class="act">
      <button class="btn" data-k="jump" type="button">PULAR</button>
      <button class="btn" data-k="punch" id="punchBtn" type="button">GOLPE</button>
      <button class="btn" data-k="kick" type="button">CHUTE</button>
      <button class="btn" data-k="dash" type="button" id="dashBtn">DASH</button>
      <button class="btn" data-k="rage" type="button" id="rageBtn">FÚRIA</button>
      <button class="btn" data-k="power" type="button" id="powerBtn">PODER</button>
    </div>
  </div>

  <div class="foot">
    <p class="hint"><b>Teclado:</b> ← → mover · ↑ pular · J golpe · K chute · Shift dash · L fúria · U poder. Segurar para trás defende; defender na hora do golpe faz PARRY. O dash desvia de tudo no começo. Toque duas vezes na seta para dar dash.</p>
    <div class="foot-btns">
      <button class="snd" id="bloodBtn" type="button">Sangue: ligado</button>
      <button class="snd gold" id="shopBtn" type="button">Loja</button>
      <button class="snd" id="snd" type="button">Som: ligado</button>
    </div>
  </div>
</main>

<section class="shop" id="shop" hidden aria-label="Loja">
  <div class="shop-top"><b>LOJA</b><span class="coins" id="coins">0</span></div>
  <canvas id="pv" aria-label="Prévia do lutador"></canvas>
  <div class="tabs">
    <button type="button" data-tab="v" class="on">Visual</button>
    <button type="button" data-tab="o">Roupas</button>
    <button type="button" data-tab="w">Armas</button>
    <button type="button" data-tab="p">Poderes</button>
  </div>
  <ul class="items" id="items"></ul>
  <button class="go" id="shopGo" type="button">Continuar</button>
</section>

var AC=null, muted=false;
function ac(){
  if(AC===null){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } }
  if(AC&&AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  return AC||null;
}
function tone(f,d,type,v,sl){
  if(muted) return; var a=ac(); if(!a) return;
  try{
    var t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(sl) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);
    g.gain.setValueAtTime(v||0.06,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
function noise(d,v,fq){
  if(muted) return; var a=ac(); if(!a) return;
  try{
    var n=Math.floor(a.sampleRate*d), b=a.createBuffer(1,n,a.sampleRate), c=b.getChannelData(0);

    var fl=a.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=fq||1200;
    var g=a.createGain(); g.gain.value=v||0.1;
    s.connect(fl); fl.connect(g); g.connect(a.destination); s.start();
  }catch(e){}
}

function startGun(f,m){
  var g=f.wdef.gun, su=Math.max(3,Math.round(g.su*m)), rc=Math.max(8,Math.round(g.rc*m));
  f.atk={type:'punch',gun:true,t:0,su:su,ac:1,dur:su+1+rc,hit:true,fired:false,T:g,step:0,maxS:0};
  f.vx=0;
}
function fire(f,A){
  var g=A.T; A.fired=true;
  bullets.push({x:f.x+f.dir*42*f.s,y:f.y-76*f.s,dir:f.dir,vx:f.dir*g.speed,life:Math.ceil(g.range/g.speed),r:g.r,owner:f,T:g,kind:g.kind||'bullet'});
  f.vx=-f.dir*1.6;
  if(g.kind==='arrow'){ sfx.swing(); spark(f.x+f.dir*48,f.y-76,'#bff3ff',5,2,0.02); }
  else{
    spark(f.x+f.dir*48,f.y-76,'#ffe27a',8,3,0.05); spark(f.x+f.dir*48,f.y-76,'#ff9a2e',4,2,0.02);
    sfx.shot(g.dmg>10); buzz(18);
    if(g.dmg>10&&!reduce) G.shake=Math.max(G.shake,3);
  }
}
function updateBullets(){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i]; b.x+=b.vx; b.life--;
    var d=b.owner===P?E:P, gone=b.life<=0||b.x<-10||b.x>W+10;
    if(!gone&&d&&!d.ko){
      if(Math.abs(b.x-d.x)<16*d.s+b.r&&b.y>d.y-104*d.s-b.r&&b.y<d.y+b.r){
        if(iframes(d)){ dodged(d,b); }
        else{
          land(b.owner,d,{type:'punch',hit:true,t:0},b.T,b.dir,true); gone=true;
          if(b.kind==='wave') spark(b.x,b.y,'#bff3ff',12,5,0.1);
        }
      }
    }
    if(gone) bullets.splice(i,1);
    if(G.state!=='fight') break;
  }
}
function enrage(f){
  f.berMax=Math.round(BER_T*f.berserkDur); f.berserk=f.berMax; f.rage=100; f.roarT=26;
  G.flash=reduce?0.2:0.55; G.shake=Math.max(G.shake,reduce?2:10);
  sfx.roar(); buzz([40,30,80]);
  floatText(f.x,f.y-125,'FÚRIA!','#ff5a3a');
  spark(f.x,f.y-50,'#ff7a1a',26,5,0.05);
}

/* poderes */
function startPower(f,pid){
  var D=byId(POWERS,pid);
  f.pw={id:D.id,def:D,t:0,hit:false,tx:0};
  f.pcd=Math.round(D.cd*f.cdMul); f.vx=0; f.block=false;
  floatText(f.x,f.y-135*f.s,D.name.toUpperCase(),'#d6a8ff'); sfx.power();
}
function powerTick(f,o){
  var w=f.pw, D=w.def, t=w.t, K=D.kind, dir=f.dir, A={type:'power',hit:true,t:0};
  if(o.ko||G.state!=='fight'){ f.pw=null; return; }
  var dxF=(o.x-f.x)*dir, adx=Math.abs(o.x-f.x), near=Math.abs(o.y-f.y)<80, hd=o.x>=f.x?1:-1;
  if(K==='wave'){
    if(t===D.su){ bullets.push({x:f.x+dir*38,y:f.y-60*f.s,dir:dir,vx:dir*9,life:31,r:26,owner:f,T:D.T,kind:'wave'}); sfx.shot(true); if(!reduce) G.shake=Math.max(G.shake,3); }
  } else if(K==='arrow'){
    if(t===D.su){ bullets.push({x:f.x+dir*40,y:f.y-76*f.s,dir:dir,vx:dir*19,life:17,r:6,owner:f,T:D.T,kind:'arrow'}); sfx.swing(); }
  } else if(K==='volley'){
    if(t>=D.su&&t<D.su+25&&(t-D.su)%5===0){
      var j=(t-D.su)/5-2;
      bullets.push({x:f.x+dir*40,y:f.y-(66+j*7)*f.s,dir:dir,vx:dir*14,life:17,r:5,owner:f,T:D.T,kind:'star'}); sfx.shot(false);
    }
  } else if(K==='burst'){
    if(t===D.su){
      addFx('ring',f.x,f.y-50,'#d6a8ff',22,10,120,true); addFx('ring',f.x,GY,'#ffffff',22,10,130,false);
      sfx.roar(); if(!reduce) G.shake=Math.max(G.shake,8);
      if(adx<118&&Math.abs(o.y-f.y)<100) land(f,o,A,D.T,hd);
    }
  } else if(K==='slam'){
    if(t===D.su){
      addFx('ring',f.x+dir*70,GY,'#ffd9a0',20,10,110,false); dust(f); spark(f.x+dir*70,GY,'#ffb36b',16,5,0.2);
      sfx.boom(); if(!reduce) G.shake=Math.max(G.shake,11);
      if(dxF>-12&&dxF<100+16*o.s&&near) land(f,o,A,D.T,dir);
    }
  } else if(K==='pillar'){
    if(t===1){ w.tx=o.x; addFx('warn',w.tx,GY,'#ff5a2a',D.su,0,0); }
    if(t===D.su){
      addFx('pillar',w.tx,GY,'#ff7a1a',24); spark(w.tx,GY-20,'#ff9a2e',22,5,0.05); sfx.boom();
      if(Math.abs(o.x-w.tx)<48&&o.y>GY-70) land(f,o,A,D.T,hd);
    }
  } else if(K==='dash'){
    if(t>D.su&&t<=D.su+16){
      f.x=clamp(f.x+dir*13,26,W-26);
      if(t%3===0) dust(f);
      if(!w.hit&&Math.abs(o.x-f.x)<36&&near){ w.hit=true; land(f,o,A,D.T,dir); }
    }
  } else if(K==='flurry'){
    var k=(t-D.su)/6;
    if(t>D.su&&(t-D.su)%6===0&&k<=6){
      if(adx<100&&near){ land(f,o,A,k===6?D.T2:D.T,dir); }
    }
  } else if(K==='solar'){
    if(t===D.su){
      addFx('ring',f.x+dir*40,f.y-60,'#ffd23f',20,10,100,true); sfx.boom();
      if(dxF>-12&&dxF<108&&near) land(f,o,A,D.T,dir);
    }
  } else if(K==='drain'){
    if(t===D.su&&dxF>-12&&dxF<76&&near){
      var h0=o.hp; land(f,o,A,D.T,dir);
      var gain=Math.max(0,h0-o.hp); f.hp=Math.min(f.max,f.hp+gain);
      floatText(f.x,f.y-150*f.s,'+'+Math.round(gain),'#7dffa0'); spark(f.x,f.y-60,'#7dffa0',14,3,0.05);
    }
  } else if(K==='nova'){
    if(t===D.su){
      addFx('ring',f.x,f.y-60,'#fff2c0',26,10,260,true); addFx('ring',f.x,GY,'#ffe27a',26,10,260,false);
      G.flash=Math.max(G.flash,reduce?0.1:0.45); if(!reduce) G.shake=Math.max(G.shake,10); sfx.boom();
      if(adx<250&&o.y>GY-75) land(f,o,A,D.T,hd);
    }
  } else if(K==='shield'){
    if(t===D.su){ f.shield=200; addFx('ring',f.x,f.y-55,'#bfe9ff',20,10,60,true); floatText(f.x,f.y-150*f.s,'CRISTAL','#bfe9ff'); }
  }
  if(f.pw&&t>=D.len) f.pw=null;
}
var DASH_T=14, DASH_CD=34, DASH_IF=9;
function startDash(f,inp){
  var mv=(inp.right?1:0)-(inp.left?1:0), dir=mv!==0?mv:-f.dir;
  if(mv===0){ if(f.x<64&&dir<0) dir=1; else if(f.x>W-64&&dir>0) dir=-1; }
  f.dash={t:0,dir:dir,fwd:dir===f.dir}; f.dcd=DASH_CD; f.block=false; f.vx=0; f.atk=null; f.wv=0;
  inp.u.dash=1; dust(f); sfx.dash();
}
function dodged(d,a){
  if(d.dodgeT>35) return;
  d.dodgeT=50;
  floatText(d.x,d.y-128*d.s,'ESQUIVA!','#7ee0a8');
  addFx('ring',d.x,d.y-52,'#7ee0a8',14,8,54,true);
  spark(d.x,d.y-50,'#7ee0a8',6,3,0.02);
  if(d.isPlayer){ G.score+=60; if(d.berserk<=0) d.rage=Math.min(100,d.rage+8); if(!reduce) G.slow=Math.max(G.slow,12); }
  sfx.dodge();
}
function step(f,inp,o){
  f.t++;
  if(f.hitFlash>0) f.hitFlash--;
  if(f.pcd>0) f.pcd-=(f.berserk>0?2:1);
  if(f.dcd>0) f.dcd--;
  if(f.dodgeT>0) f.dodgeT--;
  if(f.shield>0) f.shield--;
  if(f.ghost>f.hp) f.ghost+=(f.hp-f.ghost)*0.06; else f.ghost=f.hp;
  if(f.berserk>0){ f.berserk--; if(f.berserk===0) f.rage=0; if(f.t%3===0) ember(f); }
  for(var gi=f.gh.length-1;gi>=0;gi--){ f.gh[gi].t++; if(f.gh[gi].t>13) f.gh.splice(gi,1); }
  if(f.ko){
    f.koT++; f.vy+=GRAV; f.y+=f.vy; f.x+=f.vx; f.vx*=0.95; f.pw=null; f.dash=null;
    if(f.y>=GY){ f.y=GY; if(f.vy>3){ f.vy*=-0.35; dust(f); } else f.vy=0; }
    f.x=clamp(f.x,24,W-24); return;
  }
  var wasB=f.block;
  f.block=false; f.moving=false;
  var sp=f.speed*(f.berserk>0?1.35:1), dxo=o.x-f.x;
  if(f.stun>0||f.atk||f.pw||f.dash) f.wv=0;
  if(f.stun>0){ f.stun--; f.x+=f.vx; f.vx*=0.86; }
  else if(f.dash){
    var D=f.dash; D.t++;
    f.dir=dxo>=0?1:-1;
    var spd=D.t<=9?10.5:D.t<=12?4:1.6;
    f.x+=D.dir*spd*(D.fwd?1:0.92);
    if(D.t%2===0) f.gh.push({x:f.x,y:f.y,t:0});
    if(D.t%3===1) spark(f.x-D.dir*14,GY,'#cdbfae',2,1.4,0.05);
    if(D.t>=8&&(inp.punch||inp.kick)){
      var tyd=inp.punch?'punch':'kick', fw=D.fwd;
      f.dash=null; startAtk(f,tyd,0); inp.u[tyd]=1; f.vx=f.dir*(fw?4.6:1.4);
    } else if(D.t>=DASH_T) f.dash=null;
  }
  else if(f.pw){ f.pw.t++; powerTick(f,o); }
  else if(f.atk){
    var A=f.atk; A.t++; f.x+=f.vx; if(f.onGround) f.vx*=0.88;
    if(A.gun&&!A.fired&&A.t>=A.su) fire(f,A);
    var rec=A.t>=A.su+A.ac;
    if(inp.dash&&f.dcd<=0&&f.onGround&&A.hit&&rec&&(!A.gun||A.fired)){ f.atk=null; startDash(f,inp); }
    else if((f.isPlayer||f.ai)&&!A.gun&&A.hit&&rec&&(inp.punch||inp.kick)&&A.step+1<A.maxS){
      var ty=inp.punch?'punch':'kick';
      f.dir=o.x>=f.x?1:-1; startAtk(f,ty,A.step+1); inp.u[ty]=1;
    } else if(A.t>=A.dur) f.atk=null;
  }
  else if(f.roarT>0){ f.roarT--; }
  else if(f.cheer){ /* comemorando */ }
  else {
    var toward=dxo>0?inp.right:inp.left, away=dxo>0?inp.left:inp.right;
    var mv=(inp.right?1:0)-(inp.left?1:0);
    if(f.onGround){
      f.dir=dxo>=0?1:-1;
      var tgt=0;
      if(away&&!toward){ f.block=true; tgt=mv*sp*0.4; }
      else if(mv){ tgt=mv*sp; }
      f.wv+=(tgt-f.wv)*0.34; f.x+=f.wv; f.moving=Math.abs(f.wv)>0.45;
      if(f.moving) f.walkT+=0.22*Math.abs(f.wv)/3;
      if(inp.dash&&f.dcd<=0){ startDash(f,inp); }
      else if(inp.jump){ f.vy=-JUMP; f.onGround=false; f.vx=mv*sp*0.85; f.block=false; inp.u.jump=1; sfx.jump(); }
    } else { f.x+=f.vx; }
    if(f.dash){ /* dash começou neste quadro */ }
    else if(inp.power&&f.pcd<=0&&f.onGround&&f.powers.length){
      startPower(f,typeof inp.power==='string'?inp.power:f.powers[0]); inp.u.power=1;
    }
    else if(inp.punch||inp.kick){ var ty2=inp.punch?'punch':'kick'; startAtk(f,ty2,0); inp.u[ty2]=1; }
    else if(inp.rage&&f.rage>=100&&f.berserk<=0&&f.onGround){ enrage(f); inp.u.rage=1; }
  }
  if(f.block) f.blkT=wasB?f.blkT+1:0; else f.blkT=99;
  if(!f.onGround){
    f.vy+=GRAV; f.y+=f.vy;
    if(f.y>=GY){ f.y=GY; f.vy=0; f.onGround=true; if(f.stun<=0) f.vx=0; dust(f); }
  }
  f.x=clamp(f.x,26,W-26);
}
function iframes(f){ return !!f.dash&&f.dash.t<=DASH_IF; }
function separate(){
  if(!P||!E||P.ko||E.ko) return;
  if(iframes(P)||iframes(E)) return;
  if(P.y>GY-46&&E.y>GY-46){
    var d=E.x-P.x, minD=36;
    if(Math.abs(d)<minD){ var push=(minD-Math.abs(d))/2, sg=d>=0?1:-1; if(d===0) sg=P.dir; P.x-=sg*push; E.x+=sg*push; }
  }
  P.x=clamp(P.x,26,W-26); E.x=clamp(E.x,26,W-26);
}
function hit(a,d){
  var A=a.atk; if(!A||A.hit||a.ko||d.ko) return;
  if(A.t<A.su||A.t>=A.su+A.ac) return;
  var T=A.T, s=a.s;
  var x0=a.x+a.dir*8*s, x1=a.x+a.dir*T.range*s, hx0=Math.min(x0,x1), hx1=Math.max(x0,x1);
  var hy0=a.y+T.y0*s, hy1=a.y+T.y1*s;
  var dx0=d.x-16*d.s, dx1=d.x+16*d.s, dy0=d.y-104*d.s, dy1=d.y;
  if(hx1<dx0||hx0>dx1||hy1<dy0||hy0>dy1) return;
  land(a,d,A,T,a.dir);
}
function land(a,d,A,T,dir,proj){
  if(iframes(d)){ A.hit=true; dodged(d,a); return; }
  A.hit=true;
  var cb=G.combo, chain=(cb.owner===a&&cb.t>0)?cb.n:0;
  var dmg=T.dmg*a.dmgMul*(a.berserk>0?1.5:1)*(1-d.def)*Math.max(0.5,1-0.08*chain);
  var hx=d.x-dir*10, hy=d.y-(A.type==='kick'?45:78)*d.s;
  if(d.shield>0){
    dmg*=0.25; spark(hx,hy,'#bfe9ff',8,3.5); sfx.block();
    d.hp=Math.max(1,d.hp-dmg); G.hitstop=2; floatText(d.x,d.y-120*d.s,'CRISTAL','#bfe9ff'); return;
  }
  if(d.block&&d.onGround&&!T.gb&&d.isPlayer&&d.blkT<=7){
    /* PARRY: defesa no tempo certo, sem dano e o atacante fica atordoado */
    floatText(d.x,d.y-122*d.s,'PARRY!','#ffd23f');
    addFx('ring',hx,hy,'#ffd23f',14,6,46,true); spark(hx,hy,'#ffd23f',10,4.5,0.05); spark(hx,hy,'#ffffff',5,3);
    sfx.parry(); buzz(24); G.hitstop=7; if(!reduce) G.slow=Math.max(G.slow,10);
    if(d.berserk<=0) d.rage=Math.min(100,d.rage+12);
    G.score+=150;
    if(!proj&&a&&!a.ko){ a.atk=null; a.pw=null; a.stun=30; a.vx=-dir*3.2; a.hitFlash=0; }
    return;
  }
  if(d.block&&d.onGround&&!T.gb){
    dmg*=0.2; d.hp=Math.max(1,d.hp-dmg); d.vx=dir*T.kb*0.9; d.x+=dir*2;
    spark(hx,hy,'#9fd4ff',8,3.5); sfx.block(); G.hitstop=3;
    floatText(d.x,d.y-112*d.s,'DEFESA','#9fd4ff');
    if(a.rage<100&&a.berserk<=0) a.rage=Math.min(100,a.rage+3);
    return;
  }
  var counter=!!d.atk&&d.stun<=0&&d.atk.t<d.atk.su+d.atk.ac;
  if(counter) dmg*=1.3;
  var air=!d.onGround;
  d.hp-=dmg; d.stun=Math.round((T.stun+(T.launch?10:0))*(d.berserk>0?0.6:1)); d.atk=null; d.pw=null; d.roarT=0; d.dash=null;
  d.vx=dir*T.kb*(T.launch?1.3:1);
  if(T.launch){ d.vy=-8.5; d.onGround=false; d.stun=Math.max(d.stun,38); }
  else if(air){ d.vy=-3.5; }
  d.hitFlash=8;
  if(a.berserk<=0) a.rage=Math.min(100,a.rage+9*a.rageGain);
  if(d.berserk<=0) d.rage=Math.min(100,d.rage+13);
  if(a.berserk>0) a.hp=Math.min(a.max,a.hp+dmg*0.18);
  if(cb.owner===a&&cb.t>0) cb.n++; else cb.n=1;
  cb.owner=a; cb.t=T.launch?60:36;
  spark(hx,hy,a.berserk>0?'#ff7a1a':'#ffe27a',12,5); spark(hx,hy,'#ffffff',4,3);
  addFx('slash',hx,hy,'#ffffff',7,(dir>0?-0.5:Math.PI+0.5)+rnd(-0.4,0.4),0);
  bloodFx(hx,hy,dir,Math.round(5+dmg*0.5+(T.launch?5:0)),(T.launch||A.type==='kick')?1.3:1);
  floatText(d.x,d.y-112*d.s,String(Math.round(dmg)),a.berserk>0?'#ff7a1a':'#ffe27a');
  if(T.fin) floatText(d.x,d.y-138*d.s,'FINALIZADOR!','#ffd23f');
  else if(counter) floatText(d.x,d.y-138*d.s,'CONTRA!','#9fe8ff');
  else if(air&&a.isPlayer&&cb.n>1) floatText(d.x,d.y-138*d.s,'AÉREO','#9fe8ff');
  buzz(A.type==='kick'||T.launch?28:16);
  G.hitstop=A.type==='kick'||T.launch?6:4; G.shake=Math.max(G.shake,reduce?1:(A.type==='kick'||T.launch?7:4));
  if(A.type==='kick'||T.launch) sfx.heavy(); else sfx.hit();
  if(a.isPlayer) G.score+=Math.round(dmg)*10;
  if(d.hp<=0){
    d.hp=0; d.ko=true; d.koT=0; d.vy=-8; d.vx=dir*5; d.atk=null; d.stun=0; d.onGround=false;
    G.slow=reduce?0:80; G.shake=reduce?2:16; G.flash=reduce?0.2:0.6; sfx.ko();
    bloodFx(d.x,d.y-62,dir,48,1.8); bloodFx(d.x,d.y-40,-dir,16,1);
    endCombo();
    endRound(a,'ko');
  }
}
function endCombo(){
  var c=G.combo;
  if(c.owner&&c.owner===P&&c.n>=2){
    var pts=c.n*c.n*20; G.score+=pts; addCoins(c.n);
    floatText(P.x,P.y-150,'COMBO '+c.n+'x +'+pts,'#ffd23f');
  }
  c.n=0; c.t=0; c.owner=null;
}
function endRound(w,why){
  G.state='roundend'; G.endT=0; G.winner=w; G.why=why; G.bonus=0; G.cg=0; G.perfect=false;
  if(w===P){
    G.pw++;
    G.bonus=1000+Math.ceil(G.tf/60)*20+Math.round(P.hp/P.max*500);
    G.cg=30+Math.round(P.hp/P.max*20);
    if(P.hp>=P.max){ G.perfect=true; G.bonus+=1500; G.cg+=40; }
    if(G.pw>=WINS){ G.bonus+=2000*(G.stage+1); G.cg+=(STAGES[G.stage].boss?110:80)*(G.stage+1)*0.8|0; }
    G.score+=G.bonus; addCoins(G.cg); sfx.coin();
  } else G.ew++;
}
function timeUp(){
  var w=(P.hp/P.max>=E.hp/E.max)?P:E;
  endCombo(); endRound(w,'time');
}
function afterRound(){
  if(G.pw>=WINS){
    if(G.stage>=STAGES.length-1){ G.state='victory'; saveHi(); }
    else openShop('next');
  } else if(G.ew>=WINS){ G.state='gameover'; saveHi(); }
  else { G.round++; newRound(); }
}
function saveHi(){ if(G.score>G.hi){ G.hi=G.score; try{ localStorage.setItem('berserker-hi',String(G.hi)); }catch(e){} } }

/* ---------- IA ---------- */
/* o que o jogador está fazendo que pode acertar a IA em breve */
function threatOf(e,p){
  var dist=Math.abs(p.x-e.x), best=null, pa=p.atk, pw=p.pw, i;
  if(pa&&!pa.gun&&pa.t<pa.su+pa.ac&&dist<pa.T.range*p.s+36&&Math.abs(p.y-e.y)<80) best={k:'melee',t:Math.max(0,pa.su-pa.t),key:pa};
  if(pw&&pw.t<=pw.def.su+2){
    var kd=pw.def.kind, rng=kd==='nova'?250:kd==='dash'?290:130;
    var inr=kd==='pillar'?(pw.t>1&&Math.abs(pw.tx-e.x)<64):dist<rng;
    if(inr&&kd!=='wave'&&kd!=='arrow'&&kd!=='volley'&&kd!=='shield') best={k:'pow',t:Math.max(0,pw.def.su-pw.t),key:pw};
  }

function chainFor(IQ){ if(Math.random()<0.35-IQ*0.2) return 0; return 1+((Math.random()*(1+IQ*2))|0); }
function aiInput(e,p){
  var A=e.ai, i=noin(), IQ=A.iq;
  var dx=p.x-e.x, dist=Math.abs(dx), tw=dx>0?'right':'left', aw=dx>0?'left':'right';
  var free=e.onGround&&!e.atk&&!e.pw&&!e.dash&&e.stun<=0&&e.roarT<=0&&!e.cheer;
  var atkRec=!!e.atk&&e.atk.hit&&e.atk.t>=e.atk.su+e.atk.ac&&(!e.atk.gun||e.atk.fired);
  var canDash=e.onGround&&e.dcd<=0&&e.stun<=0&&!e.pw&&!e.dash&&e.roarT<=0&&(!e.atk||atkRec);
  var wallBack=(aw==='left'&&e.x<62)||(aw==='right'&&e.x>W-62);
  var rd=Math.round(lerp(15,3,IQ)), TH=threatOf(e,p), busy=false, r;
  if(A.fu>0) A.fu--;
  /* 1) percebe a ameaça (com atraso de reação) e escolhe como responder */
  if(TH){
    if(A.key!==TH.key){ A.key=TH.key; A.seenT=0; A.resp=null; }
    A.seenT++;
    if(A.seenT>=rd&&!A.resp){
      r=Math.random(); var dp=0.15+0.7*IQ, bp=A.blk+0.2;
      if(TH.k==='proj') A.resp=(r<dp&&IQ>0.4)?'thru':(r<dp+0.3)?'jump':(r<dp+0.3+bp)?'block':'none';
      else if(TH.k==='melee') A.resp=r<dp?((Math.random()<0.2+0.4*IQ&&dist<76)?'thru':'back'):r<dp+bp?'block':r<dp+bp+0.08?'jump':'none';
      else A.resp=r<dp+0.15?(Math.random()<0.4?'thru':'back'):r<dp+0.35?'jump':'block';
    }
  } else { A.key=null; A.seenT=0; A.resp=null; }
  if(TH&&A.resp&&A.resp!=='none'&&e.stun<=0){
    var rs=A.resp;
    if((rs==='back'||rs==='thru')&&!canDash&&TH.t<=8) rs='block';
    if(rs==='back'||rs==='thru'){
      busy=true;
      if(TH.t<=8&&canDash){ i.dash=1; i[(rs==='thru'||wallBack)?tw:aw]=1; }
    } else if(rs==='block'){
      busy=true; if(free||atkRec) i[aw]=1;
    } else if(rs==='jump'){
      busy=true;
      var jw=TH.k==='proj'?(TH.t<=20&&TH.t>=9):(TH.t<=14&&TH.t>=3);
      if(free&&jw){ i.jump=1; i[aw]=1; }
    }
  }
  /* 2) ataque, perseguição e espaçamento */
  if(!busy){
    if(A.rageUse&&free&&e.rage>=100&&e.berserk<=0&&Math.random()<0.06) i.rage=1;
    if(atkRec&&!e.atk.gun&&A.chain>0){ A.chain--; if(A.chain===0&&Math.random()<0.4) i.kick=1; else i.punch=1; }
    var recov=(p.atk&&!p.atk.gun&&p.atk.t>=p.atk.su+p.atk.ac&&p.atk.t<p.atk.dur-3)||(p.pw&&p.pw.t>p.pw.def.su+3)||(p.dash&&p.dash.t>9);
    if(free&&recov&&dist<90&&Math.random()<0.03+IQ*0.27){ i.punch=1; A.chain=chainFor(IQ); A.cd=rnd(A.react[0],A.react[1]); }
    else if(free&&recov&&dist>=90&&dist<200&&canDash&&IQ>0.5&&Math.random()<0.12){ i.dash=1; i[tw]=1; A.fu=24; A.cd=20; }
    if(free&&!p.onGround&&dist<92&&p.y<GY-24&&Math.random()<0.1+IQ*0.2) i.kick=1;
    if(free&&canDash&&(e.x<50||e.x>W-50)&&dist<100&&(p.atk||A.mode==='approach')&&Math.random()<0.06+IQ*0.1){ i.dash=1; i[tw]=1; }
    if(e.powers.length&&e.pcd<=0&&free&&e.roarT<=0&&!i.punch&&!i.kick&&!i.dash){
      var pid=e.powers[(Math.random()*e.powers.length)|0], pd=byId(POWERS,pid), ok=dist>=pd.ai[0]&&dist<=pd.ai[1];
      if(pd.kind==='shield') ok=!!p.atk||e.hp<e.max*0.5;
      if(ok&&Math.random()<(recov?0.16:0.05)) i.power=pid;
    }
    A.cd--;

      var r2=Math.random(), fast=e.berserk>0?0.6:1, ranged=!!(p.wdef&&p.wdef.gun);
      if(dist>150){

        else if(r2<0.8){ A.mode='approach'; A.cd=rnd(14,30); } else { A.mode='wait'; A.cd=rnd(8,16); }
        if(Math.random()<0.03+0.05*A.aggr) i.jump=1;
      } else if(dist>86){
        if(r2<0.5){ A.mode='approach'; A.cd=rnd(6,14); }
        else if(r2<0.72){ i.kick=1; A.mode='wait'; A.cd=rnd(A.react[0],A.react[1])*fast; }
        else if(canDash&&IQ>0.4&&r2<0.86){ i.dash=1; i[tw]=1; A.fu=24; A.cd=18; }
        else { A.mode='wait'; A.cd=10; }
      } else {
        if(r2<A.aggr){ if(Math.random()<0.62) i.punch=1; else i.kick=1; A.chain=i.punch?chainFor(IQ):0; A.mode='wait'; A.cd=rnd(A.react[0],A.react[1])*fast; }
        else if(r2<A.aggr+0.14){ A.mode='retreat'; A.cd=rnd(10,22); }
        else if(r2<A.aggr+0.24){ A.mode='block'; A.cd=rnd(14,26); }
        else if(canDash&&IQ>0.45&&r2<A.aggr+0.32){ i.dash=1; i[wallBack?tw:aw]=1; A.cd=22; }
        else { A.mode='wait'; A.cd=rnd(8,16); }
      }
    }
    var ideal=e.weapon==='colossal'?70:e.weapon==='katana'?60:54;
    if(A.mode==='approach'){ if(dist>ideal) i[tw]=1; }
    else if(A.mode==='retreat'||A.mode==='block'){
      i[aw]=1;
      if(A.mode==='retreat'&&(e.x<60||e.x>W-60)){ A.mode='approach'; A.cd=10; }
    }
    if(!e.onGround&&dist<76&&!e.atk&&Math.random()<0.12) i.kick=1;
    if(i.jump&&dist>70) i[tw]=1;
  }
  if(e.dash&&e.dash.fwd&&A.fu>0&&e.dash.t>=5&&dist<80) i.punch=1;
  return i;
}

function update(){
  G.ft++;
  amb.forEach(function(p){ p.x+=p.vx+Math.sin((G.ft+p.p*40)*0.03)*0.2; p.y+=p.vy; if(p.y<-5)p.y=GY; if(p.y>GY)p.y=-5; if(p.x<-5)p.x=W+5; if(p.x>W+5)p.x=-5; });
  for(var j=parts.length-1;j>=0;j--){ var q=parts[j]; q.x+=q.vx; q.y+=q.vy; q.vy+=q.g; q.life--; if(q.life<=0) parts.splice(j,1); }
  for(var t=texts.length-1;t>=0;t--){ var x=texts[t]; x.y-=0.7; x.life--; if(x.life<=0) texts.splice(t,1); }
  for(var u=fx.length-1;u>=0;u--){ fx[u].t++; if(fx[u].t>=fx[u].life) fx.splice(u,1); }
  for(var bi=blood.length-1;bi>=0;bi--){
    var bq=blood[bi]; bq.x+=bq.vx; bq.y+=bq.vy; bq.vy+=0.3; bq.vx*=0.985; bq.life--;
    if(bq.y>=bq.gy&&bq.vy>0){ if(decals.length>150) decals.shift(); decals.push({x:bq.x,y:bq.gy,r:bq.r*rnd(1.2,2.2),c:bq.c}); blood.splice(bi,1); }
    else if(bq.life<=0) blood.splice(bi,1);
  }
  var cm=G.cam, zt=1, fxx=W/2, fyy=H/2;
  if(P&&E&&(G.state==='fight'||G.state==='intro'||G.state==='roundend')){
    var mid=(P.x+E.x)/2, dd=Math.abs(P.x-E.x), zmax=reduce?1.05:1.15;
    zt=1+clamp((300-dd)/300,0,1)*(zmax-1);
    if(G.state==='roundend'&&G.endT<110&&(P.ko||E.ko)){ zt=reduce?1.05:1.22; mid=P.ko?P.x:E.x; }
    fxx=mid; fyy=GY-92;
  }
  cm.z+=(zt-cm.z)*0.07; cm.x+=(fxx-cm.x)*0.09; cm.y+=(fyy-cm.y)*0.09;
  var dcv=(P&&G.state==='fight')?P.dcd:0;
  if((dcv>0)!==dashDim){ dashDim=dcv>0; dashBtn.classList.toggle('dim',dashDim); }
  G.shake*=0.86; if(G.shake<0.3) G.shake=0; if(G.flash>0) G.flash=Math.max(0,G.flash-0.03);
  if(buf.jump>0)buf.jump--; if(buf.punch>0)buf.punch--; if(buf.kick>0)buf.kick--; if(buf.rage>0)buf.rage--; if(buf.power>0)buf.power--; if(buf.dash>0)buf.dash--;
  var ready=G.state==='fight'&&P&&P.rage>=100&&P.berserk<=0;
  if(ready!==rageReady){ rageReady=ready; rageBtn.classList.toggle('ready',ready); }
  var cd=(P&&G.state!=='title'&&G.state!=='shop')?P.pcd:0, ptxt=cd>0?String(Math.ceil(cd/60)):'PODER';
  if(ptxt!==powerTxt){ powerTxt=ptxt; powerBtn.textContent=ptxt; powerBtn.classList.toggle('cool',cd>0); }
  var wantShopBtn=G.state!=='title';
  if(shopBtn.hidden!==wantShopBtn) shopBtn.hidden=wantShopBtn;
  if(G.hitstop>0){ G.hitstop--; return; }
  if(G.slow>0){ G.slow--; if(G.ft%3) return; }
  if(G.combo.t>0){ G.combo.t--; if(G.combo.t===0) endCombo(); }
  switch(G.state){
    case 'title':
      if(G.ft%3===0) ember(P);
      break;
    case 'intro':
      G.introT++; step(P,noin(),E); step(E,noin(),P); separate();
      if(G.introT>=150){ G.state='fight'; }
      break;
    case 'fight':
      G.tf--;
      var pi=pInput(); step(P,pi,E); consume(pi);
      step(E,aiInput(E,P),P);
      separate();
      hit(P,E); if(G.state==='fight') hit(E,P);
      if(G.state==='fight') updateBullets();
      if(G.state==='fight'&&G.tf<=0) timeUp();
      break;
    case 'roundend':
      G.endT++; step(P,noin(),E); step(E,noin(),P); separate();
      if(G.endT===70&&G.winner) G.winner.cheer=true;
      if(G.endT>=190) afterRound();
      break;
    default: break;
  }

    var f=a[0], pc=1-f.dcd/DASH_CD; bar(a[2]?550:a[1],53,70,3,pc,null,pc>=1?'#7ee0a8':'#3a6a56',a[2]);
  });
  txt(String(Math.max(0,Math.ceil(G.tf/60))),320,32,32,'#f3e9dc','center',true,5);
  txt(P.name,22,66,15,'#f3e9dc','left',false,3);
  txt((E.boss?'★ ':'')+E.name,618,66,15,E.boss?'#e6b8ff':'#f3e9dc','right',false,3);
  for(var i=0;i<WINS;i++){
    ctx.beginPath(); ctx.arc(300-i*15,64,5,0,6.2832); ctx.fillStyle=i<G.pw?'#ffd23f':'rgba(0,0,0,.5)'; ctx.fill(); ctx.strokeStyle='#ffd23f'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(340+i*15,64,5,0,6.2832); ctx.fillStyle=i<G.ew?'#ffd23f':'rgba(0,0,0,.5)'; ctx.fill(); ctx.stroke();
  }
  txt('PONTOS '+String(G.score).padStart(7,'0'),14,H-14,14,'#f3e9dc','left',false,3);
  txt('RECORDE '+String(Math.max(G.hi,G.score)).padStart(7,'0'),W-14,H-14,14,'#f3e9dc','right',false,3);
  txt('◉ '+SAVE.coins,W/2,H-14,14,'#ffd23f','center',false,3);
  var cb=G.combo;
  if(cb.t>0&&cb.n>=2&&cb.owner){
    var mine=cb.owner===P;
    txt(cb.n+' HITS',mine?96:544,122,22+Math.min(14,cb.n*2),mine?'#ffd23f':'#ff7a5a','center',true,6);
  }
  if(G.state==='fight'&&P.rage>=100&&P.berserk<=0&&(G.ft&16)) txt('APERTE FÚRIA!',320,92,18,'#ffe27a','center',false,4);
}
function fitDisp(s,size,maxW){
  ctx.font=size+'px Bungee, Impact, sans-serif';
  var w=ctx.measureText(s).width;
  return w>maxW?Math.max(14,Math.floor(size*maxW/w)):size;
}
function banner(main,sub){
  var sz=fitDisp(main,46,580);
  txt(main,W/2,175,sz,'#ffe27a','center',true,8);
  if(sub) txt(sub,W/2,215,17,'#f3e9dc','center',false,4);
}
function bannerFor(){
  if(G.state==='intro'){
    var t=G.introT;
    if(t<100) return G.round===1?[E.name,(STAGES[G.stage].boss?'CHEFE · ':'')+'ESTÁGIO '+(G.stage+1)+' · '+STAGES[G.stage].place]:['RODADA '+G.round,'PLACAR '+G.pw+' x '+G.ew];
    return ['LUTE!',''];
  }
  if(G.state==='roundend'){
    if(G.endT<70) return [G.why==='ko'?'K.O.':'TEMPO!',''];
    if(G.winner===P){
      var m=G.pw>=WINS?(G.stage>=STAGES.length-1?'CAMPEÃO!':'ESTÁGIO LIMPO'):'VITÓRIA!';
      return [m,(G.perfect?'PERFEITO  ':'')+'+'+G.bonus+' PTS  +'+G.cg+' MOEDAS'];
    }
    return [G.ew>=WINS?'DERROTA':'ROUND PERDIDO',''];
  }
  return null;
}
function draw(){
  if(!cv.width) resize();
  if(shop.open) drawPreview();
  ctx.setTransform(scale,0,0,scale,0,0); ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0.4) ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  var cz=G.cam.z, ccx=clamp(G.cam.x,W/(2*cz),W-W/(2*cz)), ccy=clamp(G.cam.y,H/(2*cz),H-H/(2*cz));
  ctx.translate(W/2,H/2); ctx.scale(cz,cz); ctx.translate(-ccx,-ccy);
  drawBG(STAGES[G.stage]);
  decals.forEach(function(d){ ctx.globalAlpha=0.8; ctx.fillStyle=d.c; ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r*1.7,d.r*0.6,0,0,6.2832); ctx.fill(); });
  ctx.globalAlpha=1;
  if(P&&E){ if(E.atk&&!P.atk){ drawFighter(P); drawFighter(E); } else { drawFighter(E); drawFighter(P); } }
  drawFx();
  bullets.forEach(drawBullet);
  parts.forEach(function(q){ ctx.globalAlpha=clamp(q.life/q.max,0,1); ctx.fillStyle=q.c; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.2832); ctx.fill(); });
  ctx.globalAlpha=1;
  blood.forEach(function(q){
    ctx.globalAlpha=clamp(q.life/30,0,1); ctx.fillStyle=q.c;
    if(Math.abs(q.vx)+Math.abs(q.vy)>3.4){ ctx.strokeStyle=q.c; ctx.lineWidth=q.r*1.4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(q.x-q.vx*1.3,q.y-q.vy*1.3); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.2832); ctx.fill(); }
  });
  ctx.globalAlpha=1;
  texts.forEach(function(x){ ctx.globalAlpha=clamp(x.life/20,0,1); txt(x.t,x.x,x.y,x.t.length>6?15:20,x.c,'center',true,4); });
  ctx.globalAlpha=1;
  ctx.restore();
  if(G.state!=='title'&&G.state!=='shop'&&P&&E) drawHUD();
  var b=bannerFor(); if(b) banner(b[0],b[1]);
  if(G.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(G.flash*0.7)+')'; ctx.fillRect(0,0,W,H); }
  if(G.state==='title'){
    ctx.fillStyle='rgba(8,4,14,.45)'; ctx.fillRect(0,0,W,H);
    txt('BERSERKER',W/2,96,64,'#e2392b','center',true,10);
    txt('ARENA',W/2,148,26,'#ffe27a','center',true,6);
    txt('8 estágios, 4 chefes. Dash, parry, combos e loja.',W/2,196,15,'#f3e9dc','center',false,4);
    if(G.ft&32) txt('TOQUE PARA LUTAR',W/2,H-62,24,'#ffe27a','center',true,6);
    txt('RECORDE '+String(G.hi).padStart(7,'0')+'   ◉ '+SAVE.coins,W/2,H-24,14,'#f3e9dc','center',false,3);
  } else if(G.state==='gameover'||G.state==='victory'){
    ctx.fillStyle='rgba(8,4,14,.66)'; ctx.fillRect(0,0,W,H);
    var win=G.state==='victory';
    txt(win?'VOCÊ É LENDA':'FIM DE JOGO',W/2,130,win?46:50,win?'#ffe27a':'#e2392b','center',true,8);
    txt('PONTOS '+String(G.score).padStart(7,'0'),W/2,190,20,'#f3e9dc','center',false,4);
    if(G.score>=G.hi&&G.score>0) txt('NOVO RECORDE!',W/2,222,16,'#ffd23f','center',false,4);
    txt(win?'Os oito lutadores caíram.':'Continuar vale metade dos pontos.',W/2,254,15,'#c9bcd1','center',false,4);
    if(G.ft&32) txt(win?'TOQUE PARA JOGAR DE NOVO':'TOQUE PARA CONTINUAR',W/2,H-70,20,'#ffe27a','center',true,5);
  }
}

/* ---------- laço ---------- */
titleInit();
if(window.__berserkDebug) window.__berserkDebug({G:G,startMatch:startMatch,openShop:openShop,get P(){return P;},get E(){return E;},SAVE:SAVE,STAGES:STAGES,OUTFITS:OUTFITS,WEAPONS:WEAPONS,mkPlayer:mkPlayer,mkEnemy:mkEnemy,drawFighter:drawFighter,
  withCtx:function(c,sc,fn){ var c0=ctx,s0=scale; ctx=c; scale=sc; try{ fn(); } finally{ ctx=c0; scale=s0; } }});
var last=null, acc=0, STEP=1000/60;
function frame(now){
  if(last===null) last=now;
  var dt=Math.min(100,now-last); last=now; acc+=dt;
  while(acc>=STEP){ update(); acc-=STEP; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
